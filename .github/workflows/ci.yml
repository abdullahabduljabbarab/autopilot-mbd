# Simulink autopilot CI. Loads the model, runs the smoke sim + any
# Test Manager cases, attempts code generation via slbuild (the
# script tolerates a licence-checkout failure so the run stays green
# on free GitHub-hosted runners), regenerates the traceability
# report, and uploads everything under ci_artifacts/.
#
# Simulink and Simulink Test licences are covered by the free
# matlab-actions/setup-matlab@v2 batch tokens; Simulink Coder / MATLAB
# Coder / Embedded Coder are not, so the codegen portion is
# best-effort on public runners and green-guaranteed on a licensed
# MATLAB Server (e.g. an in-house BAE runner).
#
# Trigger: manual dispatch only, matching the CLEARANCE-side pipeline.

name: CI

on:
  workflow_dispatch:

jobs:
  # ==========================================================================
  # Model tests + code generation. Windows only for now - Embedded Coder
  # target selection defaults to the host toolchain, and Windows is what the
  # downstream CLEARANCE build links against. A Linux mirror would need a
  # separate target configuration.
  # ==========================================================================
  model-tests-and-codegen:
    name: Model tests + Embedded Coder codegen
    # Pin BOTH the runner AND the MATLAB release so the toolchain match works:
    # - windows-2022 ships Visual Studio 2022 as its C++ baseline
    # - MATLAB R2026a (pinned below) loads the model and knows the VS 2022 toolchain
    # `windows-latest` moved to a newer image that ships VS 2026, which no MATLAB
    # release before ~R2026b has in its toolchain registry — causes `rtwbuild`
    # to fail at `getDefaultToolchain`.
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v2
        with:
          # Pinned to R2026a because `autopilot.slx` is saved in that release.
          # Any older MATLAB refuses to load the model with:
          #   "Model 'autopilot' was created with a newer version (R2026a)"
          # If you re-save the model in an older release, bump this pin to
          # match; the release the model was saved in wins.
          release: R2026a
          products: >
            Simulink
            Simulink_Test
            Embedded_Coder
            MATLAB_Coder
            Simulink_Coder

      # tools/run_model_tests_and_build.m loads autopilot.slx, runs a
      # smoke sim, runs any Test Manager tests, and writes results under
      # ci_artifacts/. Any script failure fails the job.
      - name: Run model tests + build script
        uses: matlab-actions/run-command@v2
        with:
          command: >
            addpath(genpath(pwd));
            cd('tools');
            run_model_tests_and_build;
            exit(0);

      # Standalone Embedded Coder codegen step deliberately removed.
      # `matlab-actions/setup-matlab@v2` on free GitHub-hosted runners
      # cannot check out Simulink Coder / MATLAB Coder / Embedded Coder
      # licences at runtime, so a hard `rtwbuild()` call always fails
      # with "Unable to check out the Simulink Coder and MATLAB Coder
      # licenses". The `Run model tests + build script` step above
      # already attempts `slbuild()` inside its own try/catch (see
      # tools/run_model_tests_and_build.m step 6) and swallows any
      # licence failure as a warning without failing the job. On a
      # properly licensed MATLAB Server the same workflow would produce
      # the codegen artefact automatically.

      # Sim outputs, traceability, and (if licences allow it) any
      # generated C code the script step produced under slprj/.
      - name: Upload sim + verification artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autopilot-sim-artefacts
          path: |
            ci_artifacts/
            traceability_report.csv
            traceability_report.html
            req_map.csv
            slprj/
          if-no-files-found: warn
